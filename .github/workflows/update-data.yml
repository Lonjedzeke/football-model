name: Update match data

on:
  schedule:
    # Every day at 06:00 UTC: catches weekend fixtures and midweek rounds.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest results
        run: python update_data.py

      - name: Commit new results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Update match data $(date -u +%Y-%m-%d)"
            git push
          fi
